services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: artmarket
      POSTGRES_PASSWORD: artmarket
      POSTGRES_DB: artmarket
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artmarket -d artmarket"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://artmarket:artmarket@db:5432/artmarket
      JWT_SECRET: dev-secret-change-me
      CORS_ORIGINS: "*"
      SEED_ON_STARTUP: "true"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  pgdata:
